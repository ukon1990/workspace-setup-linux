# Hyprlock layout — colors come from the theme manager (generated file).
source = hyprlock-colors.conf

$font = Noto Sans

general {
    hide_cursor = true
    grace = 0
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = easeOut, 0.23, 1, 0.32, 1
    animation = fadeIn, 1, 4, easeOut
    animation = fadeOut, 1, 4, easeOut
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 1.0
    brightness = 0.85
    vibrancy = 0.15
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 320, 56
    outline_thickness = 2
    inner_color = $lock_surface
    outer_color = $lock_outline
    check_color = $lock_primary
    fail_color = $lock_fail
    font_color = $lock_text
    fade_on_empty = false
    rounding = 12
    font_family = $font
    font_size = 16
    placeholder_text = Enter password…
    fail_text = $PAMFAIL
    dots_spacing = 0.35
    dots_center = true
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = $lock_text
    font_size = 72
    font_family = $font
    position = 0, 60
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    color = $lock_text_muted
    font_size = 20
    font_family = $font
    position = 0, -8
    halign = center
    valign = center
}

